<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>漆黑的魅影</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="漆黑的魅影">
<meta name="theme-color" content="#080414">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#080414;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;padding:24px}
  .logo{width:92px;height:92px;border-radius:20px;box-shadow:0 8px 30px rgba(123,63,228,.5);margin-bottom:20px}
  h1{font-size:21px;font-weight:600;letter-spacing:1px;margin-bottom:24px}
  .card{background:#16102a;border:1px solid #2c1d4d;border-radius:16px;padding:20px 22px;max-width:340px;width:100%}
  .step{display:flex;align-items:flex-start;gap:12px;margin:12px 0;font-size:14px;line-height:1.5;color:#d6cbe8}
  .num{flex:none;width:24px;height:24px;border-radius:50%;background:#6a3fb0;color:#fff;
    font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:600}
  .arrow{font-size:19px;color:#a56bff}
  .btn{margin-top:22px;padding:13px 34px;border:none;border-radius:26px;color:#fff;
    font-size:15px;font-weight:600;background:linear-gradient(135deg,#7b3fe4,#a56bff);
    box-shadow:0 6px 20px rgba(123,63,228,.4)}
  .note{margin-top:18px;font-size:12px;color:#7d7196;text-align:center;line-height:1.6}
  .spin{width:32px;height:32px;border:3px solid #2a1b45;border-top-color:#a56bff;border-radius:50%;
    animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <img class="logo" src="apple-touch-icon.png" alt="">
  <h1>漆黑的魅影</h1>
  <div id="home">
    <div class="card">
      <div class="step"><span class="num">1</span><span>点底部中间的「分享」按钮 <span class="arrow">↗</span></span></div>
      <div class="step"><span class="num">2</span><span>下滑菜单里选「添加到主屏幕」</span></div>
      <div class="step"><span class="num">3</span><span>点右上角「添加」，回到桌面</span></div>
    </div>
    <div class="note">添加后从桌面图标打开，即可直接开始游戏<br>不添加也可以，点下面按钮直接玩</div>
    <button class="btn" onclick="start()">直接开始游戏</button>
  </div>
  <div id="loading" style="display:none;align-items:center;flex-direction:column">
    <p style="margin-bottom:24px;font-size:14px;color:#9b8fb5">正在进入游戏…</p>
    <div class="spin"></div>
  </div>
  <a id="go" href="https://poke-gba-emulator.app.workbuddy.host/?sharecode=EKLEU7IBUC" style="display:none"></a>

<script>
  var GAME = 'https://poke-gba-emulator.app.workbuddy.host/?sharecode=EKLEU7IBUC';

  function start(){
    document.getElementById('home').style.display='none';
    document.getElementById('loading').style.display='flex';
    // 用真实链接点击触发跳转，iOS web app 下比 location.href 更可靠
    var a = document.getElementById('go');
    if (a) { a.click(); }
    window.location.replace(GAME);
  }

  // 从桌面图标打开（独立全屏模式）时自动进入游戏；
  // 在 Safari 里正常浏览时停留在引导页，确保「添加到主屏幕」捕获的是这个无参数地址
  var standalone = (navigator.standalone === true) ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (standalone) {
    start();
  }
</script>
</body>
</html>
