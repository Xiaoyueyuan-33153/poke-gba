<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>漆黑的魅影</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="漆黑的魅影">
<meta name="theme-color" content="#080414">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#080414;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}
  .logo{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 30px rgba(123,63,228,.5);margin-bottom:24px}
  h1{font-size:20px;font-weight:600;letter-spacing:1px;margin-bottom:8px}
  p{font-size:13px;color:#9b8fb5;margin-bottom:28px}
  .spin{width:34px;height:34px;border:3px solid #2a1b45;border-top-color:#a56bff;border-radius:50%;
    animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .btn{margin-top:22px;padding:11px 26px;border:1px solid #6a3fb0;border-radius:22px;color:#c9a8ff;
    font-size:14px;background:transparent;display:none}
  .err{color:#ff8a8a;font-size:13px;margin-top:16px;display:none;padding:0 24px;text-align:center;line-height:1.6}
</style>
</head>
<body>
  <img class="logo" src="apple-touch-icon.png" alt="">
  <h1>漆黑的魅影</h1>
  <p id="tip">正在启动…</p>
  <div class="spin" id="spin"></div>
  <div class="err" id="err"></div>
  <button class="btn" id="btn" onclick="goBackup()">点此使用备用线路</button>

<script>
  // 完整游戏地址（参数写死在 JS 里，iOS 桌面图标不会剥离）
  var GAME = 'https://poke-gba-emulator.app.workbuddy.host/?sharecode=EKLEU7IBUC';
  // 备用：GitHub 上的完整游戏（无参数，但国内较慢）
  var BACKUP = 'game.html';
  var jumped = false;

  function goBackup(){
    window.location.replace(BACKUP);
  }
  function go(){
    if(jumped) return;
    jumped = true;
    window.location.replace(GAME);
    // 若 4 秒后还留在本页（说明目标站异常），提示用户走备用线路
    setTimeout(function(){
      document.getElementById('spin').style.display='none';
      document.getElementById('tip').style.display='none';
      var e=document.getElementById('err');
      e.style.display='block';
      e.innerHTML='主服务器连接较慢，可点下方按钮改用备用线路（加载较慢但可用）。';
      document.getElementById('btn').style.display='inline-block';
    }, 4000);
  }

  // 立刻跳转
  go();
</script>
</body>
</html>
